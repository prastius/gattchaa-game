# /etc/nginx/conf.d/my-world-gzip.conf
# Compresses the game server's other text replies (shop data, sign-in), which
# aren't compressed in advance like the game's scripts are. Ubuntu's nginx.conf
# already has "gzip on;", so this file only adds what it leaves out.
# Install once (setup-ubuntu.sh does this for new servers):
#   sudo cp deploy/nginx-gzip.conf /etc/nginx/conf.d/my-world-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
